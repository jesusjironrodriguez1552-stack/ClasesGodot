<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMatrix — Acceso</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="scanline"></div>

  <div class="login-wrapper">

    <div class="login-box">

      <div class="login-logo">
        CODE<span>MATRIX</span>
        <p class="login-sub">// ACCESO AL SISTEMA //</p>
      </div>

      <form id="form-login" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label">CORREO ELECTRÓNICO</label>
          <input type="email" class="form-input" id="login-user" placeholder="tu_correo@email.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">CONTRASEÑA</label>
          <input type="password" class="form-input" id="login-pass" placeholder="••••••••" required />
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn-submit">INICIAR SESIÓN_</button>
      </form>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="login.js"></script>

</body>
</html>
