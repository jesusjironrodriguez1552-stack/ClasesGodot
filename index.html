<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMatrix — Acceso</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="scanline"></div>

  <div class="login-wrapper">

    <div class="login-box">

      <!-- LOGO -->
      <div class="login-logo">
        CODE<span>MATRIX</span>
        <p class="login-sub">// ACCESO AL SISTEMA //</p>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active" id="tab-login" onclick="switchTab('login')">INICIAR SESIÓN</button>
        <button class="tab" id="tab-register" onclick="switchTab('register')">REGISTRARSE</button>
      </div>

      <!-- ALERTA ÉXITO -->
      <div class="alert-success" id="alert-box">
        ✔ ¡CUENTA CREADA! Ahora inicia sesión.
      </div>

      <!-- FORMULARIO LOGIN -->
      <form id="form-login" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label">USUARIO</label>
          <input type="text" class="form-input" id="login-user" placeholder="tu_usuario" />
        </div>
        <div class="form-group">
          <label class="form-label">CONTRASEÑA</label>
          <input type="password" class="form-input" id="login-pass" placeholder="••••••••" />
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn-submit">INICIAR SESIÓN_</button>
      </form>

      <!-- FORMULARIO REGISTRO -->
      <form id="form-register" onsubmit="return doRegister(event)" style="display:none">
        <div class="form-group">
          <label class="form-label">NOMBRE DE USUARIO</label>
          <input type="text" class="form-input" id="reg-user" placeholder="elige_tu_alias" />
        </div>
        <div class="form-group">
          <label class="form-label">EMAIL</label>
          <input type="email" class="form-input" id="reg-email" placeholder="tú@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">CONTRASEÑA</label>
          <input type="password" class="form-input" id="reg-pass" placeholder="mínimo 8 caracteres" />
        </div>
        <div class="form-error" id="reg-error"></div>
        <button type="submit" class="btn-submit">CREAR CUENTA_</button>
      </form>

    </div>

  </div>

  <script src="login.js"></script>

</body>
</html>
