name: Procesar M3U8

on:
  push:
    paths:
      - 'pendientes.txt'   # Se activa cuando editas pendientes.txt
  workflow_dispatch:        # También se puede correr manualmente

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # ~5.8 horas máximo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Procesar pendientes
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python procesar.py

      - name: Guardar cambios en pendientes.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pendientes.txt
          git diff --staged --quiet || git commit -m "Auto: actualizar pendientes.txt"
          git push
