name: Procesar M3U8
on:
  push:
    paths:
      - 'pendientes.txt'
  workflow_dispatch:

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Repositorios e Instalar ffmpeg
        run: |
          # 1. Reintentar si falla la actualización de índices
          sudo apt-get update --fix-missing || (sleep 5 && sudo apt-get update)
          
          # 2. Instalar con reintento automático para evitar cortes de red
          sudo apt-get install -y --no-install-recommends ffmpeg || \
          (sleep 10 && sudo apt-get install -y --fix-missing ffmpeg)

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera futuras ejecuciones

      - name: Instalar dependencias
        run: pip install requests yt-dlp # Agregué yt-dlp por si tu script lo usa

      - name: Procesar pendientes
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python procesar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pendientes.txt
          # Solo hacer commit si hay cambios reales para evitar errores de "clean tree"
          if ! git diff --cached --quiet; then
            git commit -m "Auto: actualizar pendientes.txt"
            git push origin HEAD:main
          else
            echo "No hay cambios en pendientes.txt, saltando commit."
          fi
