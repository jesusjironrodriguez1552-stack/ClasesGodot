name: Procesar M3U8
on:
  push:
    paths:
      - 'pendientes.txt'
  workflow_dispatch:
jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Procesar pendientes
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python procesar.py
      - name: Guardar cambios en pendientes.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pendientes.txt
          git diff --staged --quiet || git commit -m "Auto: actualizar pendientes.txt"
          git push origin HEAD:main
```

---

**¿Dónde se guarda el video?**

El script lo descarga en una carpeta temporal (`tempfile.TemporaryDirectory`) y luego lo sube a **Internet Archive**. Una vez subido, la carpeta temporal se borra automáticamente.
```
GitHub Actions descarga video
        ↓
Sube a Internet Archive
        ↓
Guarda el link en Supabase
        ↓
Borra el archivo temporal
